language: php
php:
- 8.5.12
matrix:
  fast_finish: true
  include:
  - php: 8.5.12
    env: SYMFONY_VERSION=2.8.*
  - php: 8.5.12
    env: SYMFONY_VERSION=^3.0
  - php: 8.5.12
    env: DEPENDENCIES=beta
before_script:
- if [ "$DEPENDENCIES" = "beta" ]; then composer config minimum-stability beta; fi;
- composer self-update
- composer install
script:
- vendor/bin/phpunit
